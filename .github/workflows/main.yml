name: Build Kernel with MemKernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Expand KernelSU submodule history and tags
      run: |
        cd KernelSU-Next
        git fetch --unshallow || true
        git fetch --tags || true
        cd ..

    - name: Integrate MemKernel (static, in-tree)
      run: |
        bash -c "$(curl -LSs https://raw.githubusercontent.com/Poko-Apps/MemKernel/main/kernel/setup.sh)"
        echo "CONFIG_MEMKERNEL=y" >> arch/arm64/configs/bg6_defconfig

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential bc bison flex libssl-dev \
          libc6-dev-arm64-cross unzip zip wget curl \
          python3 git

    - name: Download Clang toolchain
      run: |
        mkdir -p $HOME/clang
        wget -q https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b/archive/refs/heads/lineage-20.0.tar.gz -O clang.tar.gz
        tar -xzf clang.tar.gz -C $HOME/clang --strip-components=1
        rm clang.tar.gz

    - name: Set build environment
      run: |
        echo "CLANG_PATH=$HOME/clang/bin" >> $GITHUB_ENV
        echo "PATH=$HOME/clang/bin:$PATH" >> $GITHUB_ENV

    - name: Configure kernel
      run: |
        export PATH=$CLANG_PATH:$PATH
        make ARCH=arm64 O=out CC=clang LLVM=1 LLVM_IAS=1 bg6_defconfig

    - name: Show kernel release
      run: |
        make ARCH=arm64 O=out kernelrelease

    - name: Build kernel Image
      run: |
        export PATH=$CLANG_PATH:$PATH
        make ARCH=arm64 O=out CC=clang LLVM=1 LLVM_IAS=1 -j$(nproc) Image

    - name: Build Mali GPU module
      run: |
        export PATH=$CLANG_PATH:$PATH
        make -C $(pwd) M=$(pwd)/vendor/mediatek/kernel_modules/mali \
          ARCH=arm64 O=out CC=clang LLVM=1 LLVM_IAS=1 modules || true

    - name: Package boot.img with magiskboot
      run: |
        git clone --depth=1 https://github.com/topjohnwu/Magisk.git magisk
        cp magisk/native/out/arm64/magiskboot . || true
        # عدّل هذا المسار حسب هيكل مستودعك
        # ./magiskboot unpack boot.img
        # cp out/arch/arm64/boot/Image kernel
        # ./magiskboot repack boot.img new-boot.img

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-output
        path: |
          out/arch/arm64/boot/Image
          out/drivers/memkernel/*.o
